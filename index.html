<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84232a">
<title>展会名片登记</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<body>
<header>
  <h1>展会名片登记</h1>
  <p id="offline" role="status">正在准备离线资源…</p>
  <button type="button" id="prepare" hidden>重新准备离线资源</button>
  <button type="button" id="install-app" hidden>安装到桌面</button>
  <p class="install" id="install-help">安卓 Chrome 菜单 →「安装和创建快捷方式」或「添加到主屏幕」。iPhone Safari 分享 →「添加到主屏幕」。</p>
</header>
<main>
  <form id="card">
    <section>
      <h2>名片照片</h2>
      <div class="actions">
        <label class="primary pick">拍摄名片<input id="camera" type="file" accept="image/*" capture="environment"></label>
        <label class="pick">选择照片<input id="album" type="file" accept="image/*"></label>
        <button type="button" id="retry" hidden>重新识别</button>
      </div>
      <img id="preview" alt="名片原照预览" hidden>
      <p id="status" role="status">也可以直接手填。</p>
    </section>
    <section>
      <h2>客户资料</h2>
      <fieldset><legend>客户类型</legend>
        <label><input type="radio" name="type" value="国内" checked> 国内</label>
        <label><input type="radio" name="type" value="海外"> 海外</label>
      </fieldset>
      <div id="fields"></div>
      <label id="verify" hidden><input id="confirmed" type="checkbox"> 已与客户二次确认联系方式</label>
      <p id="missing" role="status"></p>
      <div class="actions">
        <button id="save" class="primary">核对并保存</button>
        <button id="clear" type="button">新建登记</button>
      </div>
    </section>
  </form>
  <section>
    <h2>本机记录 <span id="count"></span></h2>
    <div class="actions">
      <button id="excel" type="button">导出 Excel</button>
      <button id="photos" type="button">导出名片原照 ZIP</button>
    </div>
    <p id="export-status" role="status"></p>
    <ul id="records"></ul>
  </section>
</main>
<dialog id="confirmation">
  <form method="dialog">
    <h2 id="confirmTitle"></h2><p id="confirmText"></p>
    <div class="actions"><button value="cancel">继续编辑</button><button class="primary" value="save" id="confirmButton">确认保存</button></div>
  </form>
</dialog>
<script src="./vendor/tesseract.min.js" defer></script>
<script type="module" src="./app.js"></script>
</body>
</html>
